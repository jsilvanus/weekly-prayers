openapi: 3.1.0
info:
  title: Weekly Prayers API (Rukoussovellus)
  description: >
    REST API for the Evangelical Lutheran Church Weekly Prayers application (Suomen ev.lut. kirkon rukoussovellus).
    Provides public prayer submission, moderation, parish/union multi-tenancy, bishop and pastor topics,
    intercession prayer list exports (esirukouslista), weekly prayer counters, liturgical readings (Anno / Kirkkovuosi),
    and tenant configuration.
  version: 1.2.0
  contact:
    name: Yhteinen rukous - Suomen ev.lut. kirkko
servers:
  - url: /
    description: Current host / relative root
  - url: /rukous
    description: Production subpath mount

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JSON Web Token (JWT)

    CookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Authentication cookie set upon login

  schemas:
    ModerationDigestSubscriptionInput:
      type: object
      required: [frequency]
      properties:
        frequency:
          type: string
          enum: [daily, weekly]
        channel:
          type: string
          enum: [email, inapp]
          default: email
        enabled:
          type: boolean
          default: true
    ModerationDigestSubscription:
      type: object
      required: [frequency, channel, enabled]
      properties:
        frequency:
          type: string
          enum: [daily, weekly]
        channel:
          type: string
          enum: [email, inapp]
        enabled:
          type: boolean
        lastSentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    ModerationDigest:
      type: object
      description: Counts only. byReason holds finding types (for example hetu, phone) with counts.
      required: [period, totals, byReason, awaitingReview, links]
      properties:
        period:
          type: object
          required: [since, until]
          properties:
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
        totals:
          type: object
          required: [autoClean, autoReview, rejected, humanRedacted, humanConfirmedAuto, humanOverturned]
          properties:
            autoClean: { type: integer, minimum: 0 }
            autoReview: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0, description: Hard rejects in the window (not stored as prayers) }
            humanRedacted: { type: integer, minimum: 0 }
            humanConfirmedAuto: { type: integer, minimum: 0 }
            humanOverturned: { type: integer, minimum: 0 }
        byReason:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        awaitingReview:
          type: integer
          minimum: 0
          description: Public prayers currently in redaction status needs_review
        links:
          type: object
          properties:
            review:
              type: string
              example: /admin
    ModerationFinding:
      type: object
      description: Type and character offsets in the submitted text. Never the matched value or a confidence score.
      required: [type, start, end]
      properties:
        type:
          type: string
          enum: [hetu, iban, card, phone, email, address, url, plate, dob, person_name]
        start:
          type: integer
        end:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        services:
          type: object
          properties:
            api:
              type: string
              example: ok
            database:
              type: string
              example: ok

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, bishop, coordinator, worker, prayer_group, user]
        tenantId:
          type: string
          format: uuid
          nullable: true

    PrayerRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [bishop, pastor, staff, public]
        content:
          type: string
        originalContent:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isApproved:
          type: boolean
        highlightPriority:
          type: integer
          description: Z-priority value (higher values displayed first in Top 1-4)
        highlightStartDate:
          type: string
          format: date
          nullable: true
        highlightEndDate:
          type: string
          format: date
          nullable: true
        ministryGroup:
          type: string
          enum: [local, international]
        ministryTag:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        isYhtymaWide:
          type: boolean
        tenantId:
          type: string
          format: uuid
          nullable: true
        tenantName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Riihimäen seurakunta
        slug:
          type: string
          example: riihimaki
        type:
          type: string
          enum: [seurakunta, seurakuntayhtyma]
        parentId:
          type: string
          format: uuid
          nullable: true
        diocese:
          type: string
          example: Tampereen hiippakunta
        domain:
          type: string
          nullable: true
          example: riihimaenseurakunta.fi
        logoUrl:
          type: string
          nullable: true
        colorPalette:
          type: string
          example: cathedral_blue
        customColor:
          type: string
          example: "#1e3a5f"
        weekRolloverDay:
          type: string
          enum: [thursday, monday, wednesday, friday]
          default: thursday
        weekCycleMode:
          type: string
          enum: [thursday_cycle, rollover, calendar]
          default: thursday_cycle
        highlightIcon:
          type: string
          enum: [candle, star, hands]
          default: candle
          example: candle

    SiteSettings:
      type: object
      properties:
        parish_name:
          type: string
        parish_subtitle:
          type: string
        yhtyma_name:
          type: string
        color_palette:
          type: string
        custom_color:
          type: string
        show_church_logo:
          type: string
        show_parish_logo:
          type: string
        church_logo_url:
          type: string
        parish_logo_url:
          type: string
        bishop_name:
          type: string
        bishop_diocese:
          type: string
        bishop_crest_url:
          type: string
        pastor_logo_url:
          type: string
        daily_word_enabled:
          type: string
        daily_word_title:
          type: string
        daily_word_verse:
          type: string
        daily_word_content:
          type: string
        daily_word_reflection:
          type: string
        week_rollover_day:
          type: string
          example: thursday
        week_cycle_mode:
          type: string
          example: thursday_cycle
        highlight_icon:
          type: string
          enum: [candle, star, hands]
          default: candle
          example: candle

paths:
  /api/health:
    get:
      summary: Health check
      description: Check system and database connectivity status.
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/login:
    post:
      summary: Local user login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /api/auth/register:
    post:
      summary: User registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '201':
          description: User registered

  /api/auth/me:
    get:
      summary: Get currently authenticated user
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated

  /api/auth/logout:
    post:
      summary: Logout user
      responses:
        '200':
          description: Logged out successfully

  /api/prayers:
    get:
      summary: Get current week prayers
      description: Returns prayer requests grouped into bishop, pastor, staff, and public. Respects tenant week cycle settings.
      parameters:
        - in: query
          name: tenant
          schema:
            type: string
          description: Parish / tenant slug
        - in: query
          name: tenantId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of prayers for current week
          content:
            application/json:
              schema:
                type: object
                properties:
                  week:
                    type: integer
                  year:
                    type: integer
                  prayers:
                    type: object
                    properties:
                      bishop:
                        type: array
                        items:
                          $ref: '#/components/schemas/PrayerRequest'
                      pastor:
                        type: array
                        items:
                          $ref: '#/components/schemas/PrayerRequest'
                      staff:
                        type: array
                        items:
                          $ref: '#/components/schemas/PrayerRequest'
                      public:
                        type: array
                        items:
                          $ref: '#/components/schemas/PrayerRequest'
    post:
      summary: Submit a public prayer request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                lang:
                  type: string
                  enum: [fi, sv, en]
                  default: fi
      responses:
        '201':
          description: Prayer request submitted. Content is not echoed back. A flagged prayer is stored for staff review and is shown only in its redacted form.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  prayer:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      type:
                        type: string
                        enum: [public]
                      startDate:
                        type: string
                        format: date
                      endDate:
                        type: string
                        format: date
                      isApproved:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                      flagged:
                        type: boolean
        '400':
          description: Content missing or longer than 1000 characters
        '422':
          description: Deterministic personal-data match (confidence 0.9 or higher). Nothing is stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Prayer request contains personal data
                      code:
                        type: string
                        enum: [PERSONAL_DATA]
                      findings:
                        type: array
                        items:
                          $ref: '#/components/schemas/ModerationFinding'

  /api/moderation/digest/subscription:
    get:
      summary: Get own moderation digest subscription
      description: Moderators (worker and above). Returns null when no subscription exists.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription or null
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription:
                    nullable: true
                    $ref: '#/components/schemas/ModerationDigestSubscription'
        '401':
          description: Authentication required
        '403':
          description: Moderator role required
    put:
      summary: Create or update own moderation digest subscription
      description: Daily or weekly summary of automatic moderation decisions, sent by email through the mail relay. Re-enabling starts a new window now. Channel inapp is stored but not delivered yet.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDigestSubscriptionInput'
      responses:
        '200':
          description: Saved subscription
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription:
                    $ref: '#/components/schemas/ModerationDigestSubscription'
        '400':
          description: Validation error (frequency, channel or enabled)
        '401':
          description: Authentication required
        '403':
          description: Moderator role required
  /api/moderation/digest/subscription/{userId}:
    put:
      summary: Admin - set the digest subscription of a moderator
      description: Platform admin only. The target user must be a moderator (worker and above).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDigestSubscriptionInput'
      responses:
        '200':
          description: Saved subscription
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription:
                    $ref: '#/components/schemas/ModerationDigestSubscription'
        '400':
          description: Validation error, or the user is not a moderator
        '401':
          description: Authentication required
        '403':
          description: Admin role required
        '404':
          description: User not found
  /api/moderation/digest/preview:
    get:
      summary: Preview the moderation digest for the caller's tenant
      description: Computed now from the database. Nothing is sent or stored. Counts and finding types only, never prayer text.
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 7]
            default: 1
      responses:
        '200':
          description: Digest for the window ending now
          content:
            application/json:
              schema:
                type: object
                required: [days, digest]
                properties:
                  days:
                    type: integer
                    enum: [1, 7]
                  digest:
                    $ref: '#/components/schemas/ModerationDigest'
        '400':
          description: days must be 1 or 7
        '401':
          description: Authentication required
        '403':
          description: Moderator role required
  /api/prayers/check:
    post:
      summary: Check a draft public prayer for personal data (stores nothing)
      description: Runs the same deterministic rules as submission. Rate limited to 30 requests per minute per client address. Nothing is stored or logged, and the response never includes the text or confidence values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                lang:
                  type: string
                  enum: [fi, sv, en]
                  default: fi
      responses:
        '200':
          description: Decision for the draft
          content:
            application/json:
              schema:
                type: object
                required: [decision, findings]
                properties:
                  decision:
                    type: string
                    enum: [reject, review, ok]
                    description: reject = personal data found, do not submit; review = submit, staff will redact; ok = no personal data found.
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModerationFinding'
        '400':
          description: Content missing, empty or longer than 1000 characters
        '429':
          description: Too many requests from this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/prayers/week/{week}:
    get:
      summary: Get prayers for a specific week
      parameters:
        - in: path
          name: week
          required: true
          schema:
            type: integer
        - in: query
          name: year
          schema:
            type: integer
        - in: query
          name: tenant
          schema:
            type: string
        - in: query
          name: tenantId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Prayers for requested week

  /api/prayers/pending:
    get:
      summary: Get pending unapproved prayers (worker+)
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: List of pending prayers

  /api/prayers/{id}/redaction:
    put:
      summary: Set the redacted (publishable) version of a public prayer (worker+)
      description: Only the redacted text is ever shown publicly. The original stays visible to staff. Refused with 422 while the text still contains a deterministic personal-data match. Recorded as a moderation decision.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redactedContent]
              properties:
                redactedContent:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Redacted version saved (redactionSource = human, redactionStatus = redacted)
        '400':
          description: Not a public prayer, or content missing or too long
        '404':
          description: Prayer not found
        '422':
          description: Redacted text still contains personal data (code REDACTION_STILL_HAS_DATA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/prayers/{id}/redaction/confirm:
    post:
      summary: Accept the automatic redacted suggestion (worker+)
      description: Only for public prayers with redactionStatus needs_review. Sets redactionStatus to redacted and keeps redactionSource auto.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Automatic redaction confirmed
        '409':
          description: Prayer is not awaiting redaction review (code NOT_AWAITING_REVIEW)

  /api/prayers/{id}/decisions:
    get:
      summary: Moderation decision history for a prayer (worker+)
      description: Oldest first. Reasons contain finding types and counts only.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision list
          content:
            application/json:
              schema:
                type: object
                properties:
                  prayerId:
                    type: string
                    format: uuid
                  decisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        actor:
                          type: string
                          description: system or the acting user's id
                        decision:
                          type: string
                          enum: [auto_clean, auto_review, human_redacted, human_confirmed_auto, human_overturned]
                        reasons:
                          type: object
                          additionalProperties:
                            type: integer
                        createdAt:
                          type: string
                          format: date-time
        '404':
          description: Prayer not found

  /api/prayers/{id}/approve:
    post:
      summary: Approve or reject a prayer (worker+)
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isApproved]
              properties:
                isApproved:
                  type: boolean
      responses:
        '200':
          description: Prayer approval status updated
        '409':
          description: Public prayer has no accepted redacted version yet (code REDACTION_REQUIRED). Un-approving is always allowed.

  /api/prayers/{id}/highlight:
    put:
      summary: Set prayer highlight Z-value and active date window (coordinator+)
      description: Sets priority (Z-value) and date range. Defaults to one week if dates omitted. Setting priority to 0 clears highlight.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [highlightPriority]
              properties:
                highlightPriority:
                  type: integer
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Highlight updated

  /api/counts:
    get:
      summary: Get prayer count for current week
      parameters:
        - in: query
          name: tenant
          schema:
            type: string
      responses:
        '200':
          description: Current count

  /api/counts/increment:
    post:
      summary: Increment prayer counter (Rukoilin-button)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Counter incremented

  /api/export/intercession:
    get:
      summary: Get Sunday mass intercession list (esirukouslista)
      description: Returns formatted HTML view for printing or tablet reading in Sunday service.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - in: query
          name: week
          schema:
            type: integer
        - in: query
          name: year
          schema:
            type: integer
        - in: query
          name: highlightsOnly
          schema:
            type: boolean
        - in: query
          name: mode
          schema:
            type: string
            enum: [print, toggle, mobile]
        - in: query
          name: tenant
          schema:
            type: string
        - in: query
          name: token
          schema:
            type: string
            description: Direct query token authentication for tablet/sacristy access
      responses:
        '200':
          description: Intercession HTML page
          content:
            text/html:
              schema:
                type: string

  /api/settings:
    get:
      summary: Get site settings and visual branding
      responses:
        '200':
          description: Settings object
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: '#/components/schemas/SiteSettings'
    put:
      summary: Update site settings and week rollover (admin only)
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  $ref: '#/components/schemas/SiteSettings'
      responses:
        '200':
          description: Settings updated

  /api/tenants:
    get:
      summary: List all parishes and unions
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
    post:
      summary: Create a new tenant (admin only)
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                slug:
                  type: string
                type:
                  type: string
                  enum: [seurakunta, seurakuntayhtyma]
                parentId:
                  type: string
                  format: uuid
                diocese:
                  type: string
                domain:
                  type: string
                colorPalette:
                  type: string
                customColor:
                  type: string
                weekRolloverDay:
                  type: string
                weekCycleMode:
                  type: string
      responses:
        '201':
          description: Tenant created

  /api/tenants/current:
    get:
      summary: Detect and resolve current tenant hierarchy
      parameters:
        - in: query
          name: identifier
          schema:
            type: string
      responses:
        '200':
          description: Resolved tenant and union hierarchy

  /api/tenants/{identifier}:
    get:
      summary: Get tenant by ID or slug
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant details
    put:
      summary: Update tenant (admin only)
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                domain:
                  type: string
                weekRolloverDay:
                  type: string
                weekCycleMode:
                  type: string
      responses:
        '200':
          description: Tenant updated
    delete:
      summary: Delete tenant (admin only)
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant deleted

  /api/bible/today:
    get:
      summary: Get today's liturgical Bible texts from Church Calendar (Anno API)
      responses:
        '200':
          description: Daily Bible readings

  /.well-known/oauth-protected-resource/mcp:
    get:
      summary: RFC 9728 MCP protected resource metadata
      responses:
        '200':
          description: Resource metadata document

  /.well-known/oauth-authorization-server:
    get:
      summary: RFC 8414 OAuth authorization server metadata
      responses:
        '200':
          description: Authorization server metadata document

  /oauth/authorize:
    get:
      summary: OAuth authorization endpoint for MCP clients
      description: Renders consent page with option to continue anonymously or log in as a parish worker/admin.
      parameters:
        - in: query
          name: response_type
          required: true
          schema:
            type: string
            enum: [code]
        - in: query
          name: client_id
          required: true
          schema:
            type: string
        - in: query
          name: redirect_uri
          required: true
          schema:
            type: string
        - in: query
          name: code_challenge
          required: true
          schema:
            type: string
        - in: query
          name: code_challenge_method
          required: true
          schema:
            type: string
            enum: [S256]
        - in: query
          name: state
          schema:
            type: string
      responses:
        '200':
          description: HTML consent/login page
        '302':
          description: Redirect back to client with code

  /oauth/token:
    post:
      summary: OAuth 2.1 token endpoint with PKCE for MCP clients
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                code:
                  type: string
                code_verifier:
                  type: string
                redirect_uri:
                  type: string
                refresh_token:
                  type: string
                client_id:
                  type: string
      responses:
        '200':
          description: Access token issued

  /mcp:
    post:
      summary: Streamable HTTP MCP server endpoint
      description: Endpoint for MCP clients (ChatGPT, Claude, Cursor, Antigravity). Supports public anonymous tools and staff moderation tools.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: MCP JSON-RPC response
        '401':
          description: Unauthorized challenge with WWW-Authenticate header containing resource metadata

