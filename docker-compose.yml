services:
  app:
    image: ghcr.io/${IMAGE_REPO:-jsilvanus/weekly-prayers}:${IMAGE_TAG:-latest}
    container_name: prayers-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST:-pg.shared.local}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-weekly_prayers}
      DB_USER: ${DB_USER:-prayers}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: ${BASE_URL:-https://${DOMAIN:-prayers.local}}
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN:-prayers.local}}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      OIDC_GROUP_ROLE_MAP: ${OIDC_GROUP_ROLE_MAP:-{}}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-riihimaki}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    labels:
      - "traefik.enable=true"
      # If DOMAIN_PATH is set (e.g. /rukous), route both Host and PathPrefix, else route Host
      - "traefik.http.routers.prayers.rule=${TRAEFIK_RULE:-Host(`${DOMAIN:-}`) && (Path(`${DOMAIN_PATH:-/rukous}`) || PathPrefix(`${DOMAIN_PATH:-/rukous}/`))}"
      - "traefik.http.routers.prayers.entrypoints=websecure"
      - "traefik.http.routers.prayers.tls.certresolver=letsencrypt"
      - "traefik.http.services.prayers.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 5s
    networks:
      - default
      - traefik-public
      - shared_multi_network

  migrate:
    image: ghcr.io/${IMAGE_REPO:-jsilvanus/weekly-prayers}:${IMAGE_TAG:-latest}
    container_name: prayers-migrate
    restart: "no"
    env_file:
      - .env
    command: ["node", "src/db/migrations/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST:-pg.shared.local}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-weekly_prayers}
      DB_USER: ${DB_USER:-prayers}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
    networks:
      - shared_multi_network

networks:
  traefik-public:
    external: true
  shared_multi_network:
    name: shared_multi_network
    external: true
