# .github/workflows/deploy.yml
# ============================================================
# Deployment workflow for jsilvanus/weekly-prayers -> riksunsrk/rukoukset
#
# The Docker image is built and pushed to GHCR by publish-image.yml
# in the source repo (jsilvanus/weekly-prayers). This workflow only
# copies docker-compose.yml to the VM and restarts containers.
#
# Required Environment secrets (Settings -> Environments -> production -> Secrets):
#   SSH_PRIVATE_KEY, VM_HOST, VM_USER
#   DB_PASSWORD         — password for the application PostgreSQL role (${APP_NAME}_user)
#   JWT_SECRET          — application JWT signing secret
#   OIDC_CLIENT_SECRET  — OIDC client secret from Tunnus
#   GHCR_TOKEN          — classic PAT with read:packages (to pull the private image)
#   OPENAI_API_KEY      — (optional, if AI moderation enabled)
#   ANTHROPIC_API_KEY   — (optional, if Claude moderation enabled)
#
# Required Environment variables (Settings -> Environments -> production -> Variables):
#   DEPLOY_PATH         — app deployment directory on the VM (e.g. /opt/apps/rukoukset)
#   APP_NAME            — application identifier (yields ${APP_NAME}_user and ${APP_NAME}_db)
#   DOMAIN              — public hostname for Traefik routing (e.g. kehitys.riihimaenseurakunta.fi)
#   DOMAIN_PATH         — subpath routing (e.g. /rukous)
#   BASE_URL            — public base URL (e.g. https://kehitys.riihimaenseurakunta.fi/rukous)
#   NODE_ENV            — production
#   OIDC_ISSUER         — Tunnus issuer URL (e.g. https://kehitys.riihimaenseurakunta.fi/identity)
#   OIDC_CLIENT_ID      — OIDC client ID registered in Tunnus (e.g. weekly-prayers)
#   OIDC_REDIRECT_URI   — e.g. https://kehitys.riihimaenseurakunta.fi/rukous/api/auth/oidc/callback
#   OIDC_SCOPES         — openid profile email groups
#   OIDC_GROUP_ROLE_MAP — role mapping (or pattern parish/<tenant>/prayers-<role>)
#   IMAGE_TAG           — image tag to deploy (e.g. latest, sha-<short>, or vX.Y.Z)
#   DEFAULT_TENANT_SLUG — default tenant slug (e.g. riihimaki or tuomiokirkko)

name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ vars.VM_SSH_PORT || 22 }}
          source: "docker-compose.yml"
          target: ${{ vars.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # --- secrets ---
          APP_GHCR_TOKEN:         ${{ secrets.GHCR_TOKEN }}
          APP_DB_PASSWORD:        ${{ secrets.DB_PASSWORD }}
          APP_JWT_SECRET:         ${{ secrets.JWT_SECRET }}
          APP_OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          APP_OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          APP_ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          # --- variables ---
          APP_NODE_ENV:           ${{ vars.NODE_ENV || 'production' }}
          APP_PORT:               ${{ vars.APP_PORT || '3000' }}
          APP_NAME:               ${{ vars.APP_NAME || 'prayers' }}
          APP_DOMAIN:             ${{ vars.DOMAIN || 'kehitys.riihimaenseurakunta.fi' }}
          APP_DOMAIN_PATH:        ${{ vars.DOMAIN_PATH || '/rukous' }}
          APP_BASE_URL:           ${{ vars.BASE_URL || 'https://kehitys.riihimaenseurakunta.fi/rukous' }}
          APP_IMAGE_REPO:         ${{ vars.IMAGE_REPO || 'jsilvanus/weekly-prayers' }}
          APP_IMAGE_TAG:          ${{ vars.IMAGE_TAG || 'latest' }}
          APP_DB_HOST:            ${{ vars.DB_HOST || 'pg.shared.local' }}
          APP_DB_PORT:            ${{ vars.DB_PORT || '5432' }}
          APP_DB_SSL:             ${{ vars.DB_SSL || 'false' }}
          APP_OIDC_ISSUER:        ${{ vars.OIDC_ISSUER || 'https://kehitys.riihimaenseurakunta.fi/identity' }}
          APP_OIDC_CLIENT_ID:     ${{ vars.OIDC_CLIENT_ID || 'weekly-prayers' }}
          APP_OIDC_REDIRECT_URI:  ${{ vars.OIDC_REDIRECT_URI }}
          APP_OIDC_SCOPES:        ${{ vars.OIDC_SCOPES || 'openid profile email groups' }}
          APP_OIDC_GROUP_ROLE_MAP: ${{ vars.OIDC_GROUP_ROLE_MAP }}
          APP_DEFAULT_TENANT_SLUG: ${{ vars.DEFAULT_TENANT_SLUG || 'riihimaki' }}
          APP_AI_PROVIDER:        ${{ vars.AI_PROVIDER || 'openai' }}
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ vars.VM_SSH_PORT || 22 }}
          envs: >-
            APP_GHCR_TOKEN,APP_DB_PASSWORD,APP_JWT_SECRET,
            APP_OIDC_CLIENT_SECRET,APP_OPENAI_API_KEY,APP_ANTHROPIC_API_KEY,
            APP_NODE_ENV,APP_PORT,APP_NAME,APP_DOMAIN,APP_DOMAIN_PATH,APP_BASE_URL,
            APP_IMAGE_REPO,APP_IMAGE_TAG,APP_DB_HOST,APP_DB_PORT,APP_DB_SSL,
            APP_OIDC_ISSUER,APP_OIDC_CLIENT_ID,APP_OIDC_REDIRECT_URI,
            APP_OIDC_SCOPES,APP_OIDC_GROUP_ROLE_MAP,APP_DEFAULT_TENANT_SLUG,
            APP_AI_PROVIDER
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            cd "${DEPLOY_PATH}"

            if command -v python3 >/dev/null 2>&1; then
              DB_PASS_ENC=$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ.get("APP_DB_PASSWORD", ""), safe=""))')
            else
              DB_PASS_ENC="${APP_DB_PASSWORD}"
            fi

            DB_USER="${APP_NAME}_user"
            DB_NAME="${APP_NAME}_db"
            DATABASE_URL="postgresql://${DB_USER}:${DB_PASS_ENC}@${APP_DB_HOST}:${APP_DB_PORT}/${DB_NAME}"

            REDIRECT_URI="${APP_OIDC_REDIRECT_URI:-${APP_BASE_URL}/api/auth/oidc/callback}"

            # Compute Traefik rule based on whether DOMAIN_PATH is specified
            if [ -n "${APP_DOMAIN_PATH:-}" ] && [ "${APP_DOMAIN_PATH}" != "/" ]; then
              TRAEFIK_RULE="Host(\`${APP_DOMAIN}\`) && (Path(\`${APP_DOMAIN_PATH}\`) || PathPrefix(\`${APP_DOMAIN_PATH}/\`))"
            else
              TRAEFIK_RULE="Host(\`${APP_DOMAIN}\`)"
            fi

            # Write .env without echoing secrets
            {
              printf 'NODE_ENV=%s\n'            "${APP_NODE_ENV}"
              printf 'PORT=%s\n'                "${APP_PORT}"
              printf 'IMAGE_REPO=%s\n'          "${APP_IMAGE_REPO}"
              printf 'IMAGE_TAG=%s\n'           "${APP_IMAGE_TAG}"
              printf 'DOMAIN=%s\n'              "${APP_DOMAIN}"
              printf 'DOMAIN_PATH=%s\n'         "${APP_DOMAIN_PATH}"
              printf 'TRAEFIK_RULE=%s\n'        "${TRAEFIK_RULE}"
              printf 'BASE_URL=%s\n'            "${APP_BASE_URL}"
              printf 'FRONTEND_URL=%s\n'        "${APP_BASE_URL}"
              printf 'APP_NAME=%s\n'            "${APP_NAME}"
              printf 'DB_HOST=%s\n'             "${APP_DB_HOST}"
              printf 'DB_PORT=%s\n'             "${APP_DB_PORT}"
              printf 'DB_USER=%s\n'             "${DB_USER}"
              printf 'DB_NAME=%s\n'             "${DB_NAME}"
              printf 'DB_PASSWORD=%s\n'         "${APP_DB_PASSWORD}"
              printf 'DB_SSL=%s\n'              "${APP_DB_SSL}"
              printf 'DATABASE_URL=%s\n'        "${DATABASE_URL}"
              printf 'JWT_SECRET=%s\n'          "${APP_JWT_SECRET}"
              printf 'OIDC_ISSUER=%s\n'         "${APP_OIDC_ISSUER}"
              printf 'OIDC_CLIENT_ID=%s\n'      "${APP_OIDC_CLIENT_ID}"
              printf 'OIDC_CLIENT_SECRET=%s\n'  "${APP_OIDC_CLIENT_SECRET}"
              printf 'OIDC_REDIRECT_URI=%s\n'   "${REDIRECT_URI}"
              printf 'OIDC_SCOPES=%s\n'         "${APP_OIDC_SCOPES}"
              printf 'OIDC_GROUP_ROLE_MAP=%s\n' "${APP_OIDC_GROUP_ROLE_MAP}"
              printf 'DEFAULT_TENANT_SLUG=%s\n' "${APP_DEFAULT_TENANT_SLUG}"
              printf 'AI_PROVIDER=%s\n'         "${APP_AI_PROVIDER}"
              printf 'OPENAI_API_KEY=%s\n'      "${APP_OPENAI_API_KEY}"
              printf 'ANTHROPIC_API_KEY=%s\n'   "${APP_ANTHROPIC_API_KEY}"
            } > .env
            chmod 600 .env

            # Log in to GHCR to pull the private image if GHCR_TOKEN provided
            if [ -n "${APP_GHCR_TOKEN:-}" ]; then
              printf '%s' "${APP_GHCR_TOKEN}" | docker login ghcr.io -u jsilvanus --password-stdin
            fi

            docker compose pull
            if [ -n "${APP_GHCR_TOKEN:-}" ]; then
              docker logout ghcr.io || true
            fi

            # Run database migrations first
            echo "Running database migrations..."
            docker compose run --rm migrate

            # Start application container
            docker compose up -d --remove-orphans app

            # Health check with retries
            echo "Waiting for app to become healthy..."
            HEALTHY=false
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' prayers-app 2>/dev/null || echo missing)
              echo "  attempt ${i}/12: ${STATUS}"
              if [ "${STATUS}" = healthy ]; then
                echo "Health check passed."
                HEALTHY=true
                break
              fi
            done

            if [ "${HEALTHY}" != "true" ]; then
              echo "Health check failed after 60s — dumping container state and logs for diagnosis:"
              docker compose ps
              echo "--- app logs ---"
              docker compose logs app
              echo "FAIL: app never became healthy"
              exit 1
            fi
