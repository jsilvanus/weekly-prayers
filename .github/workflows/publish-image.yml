name: Publish Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag (e.g. latest, edge)'
        required: false
        default: 'latest'
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build & publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-deploy:
    name: Sync config to deployment repo
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v7

      - name: Clone deployment repo
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/riksunsrk/rukous.git" deploy-repo

      - name: Sync deployment files
        run: |
          cp docker-compose.yml deploy-repo/
          mkdir -p deploy-repo/.github/workflows
          cp .github/deployment-repo/deploy.yml deploy-repo/.github/workflows/deploy.yml
          echo "${{ github.sha }}" > deploy-repo/deploy-version.txt

      - name: Commit and push changes
        run: |
          set -euo pipefail
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml .github/workflows/deploy.yml deploy-version.txt
          if git diff --staged --quiet; then
            echo "No changes to deploy config"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            git commit -m "Deploy weekly-prayers @ ${SHORT_SHA}"
            git push origin main
          fi
